<!DOCTYPE html>
<html lang="en">
	<head>
		<base href="https://github.com/InsayneBoko/fih-port/tree/master/port/">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Deltarune Lightners Live</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<script>
        function mergeFiles(fileParts) {
          return new Promise((resolve, reject) => {
            const buffers = [];
            const fetchPart = (i) => {
              if (i >= fileParts.length) {
                const total = buffers.reduce((s, b) => s + b.byteLength, 0);
                const combined = new Uint8Array(total);
                let off = 0;
                for (const buf of buffers) { combined.set(new Uint8Array(buf), off); off += buf.byteLength; }
                resolve(URL.createObjectURL(new Blob([combined], { type: 'application/octet-stream' })));
                return;
              }
              fetch(fileParts[i])
                .then(r => { if (!r.ok) throw new Error(`Yikes, failed to fetch ${fileParts[i]}`); return r.arrayBuffer(); })
                .then(ab => { buffers.push(ab); fetchPart(i + 1); })
                .catch(reject);
            };
            fetchPart(0);
          });
        }

        function getParts(file, start, end) {
          const a = [];
          for (let i = start; i <= end; i++) a.push(`${file}.part${i}`);
          return a;
        }

        Promise.all([
          mergeFiles(getParts('index.pck', 1, 9)),
          mergeFiles(getParts('index.side.wasm', 1, 3)),
        ]).then(([pckUrl, sideWasmUrl]) => {
          const originalFetch = window.fetch.bind(window);
          window.fetch = async function(url, ...args) {
            if (typeof url === 'string') {
              if (url.endsWith('index.pck')) return originalFetch(pckUrl, ...args);
              if (url.endsWith('index.side.wasm')) return originalFetch(sideWasmUrl, ...args);
            }
            return originalFetch(url, ...args);
          };

          const originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function(method, url, ...rest) {
            if (typeof url === 'string') {
              if (url.includes('index.pck')) url = pckUrl;
              if (url.includes('index.side.wasm')) url = sideWasmUrl;
            }
            return originalOpen.call(this, method, url, ...rest);
          };

          return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'index.js';
            s.onload = resolve;
            s.onerror = () => reject(new Error('Ruh roh, failed to load index.js ):'));
            document.body.appendChild(s);
          });
        }).then(() => {
          const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":159377196,"index.wasm":1588912},"focusCanvas":true,"gdextensionLibs":["libgodotmidi.web.template_release.wasm32"],"godotPoolSize":4};
          const GODOT_THREADS_ENABLED = false;
          const engine = new Engine(GODOT_CONFIG);

          (function () {
            const statusOverlay = document.getElementById('status');
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');

            let initializing = true;
            let statusMode = '';

            function setStatusMode(mode) {
              if (statusMode === mode || !initializing) return;
              if (mode === 'hidden') {
                statusOverlay.remove();
                initializing = false;
                return;
              }
              statusOverlay.style.visibility = 'visible';
              statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
              statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
              statusMode = mode;
            }

            function setStatusNotice(text) {
              while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
              for (const line of text.split('\n')) {
                statusNotice.appendChild(document.createTextNode(line));
                statusNotice.appendChild(document.createElement('br'));
              }
            }

            function displayFailureNotice(err) {
              console.error(err);
              if (err instanceof Error) setStatusNotice(err.message);
              else if (typeof err === 'string') setStatusNotice(err);
              else setStatusNotice('Yikes, an unknown error occurred.');
              setStatusMode('notice');
              initializing = false;
            }

            const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
            if (missing.length !== 0) {
              if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
                let swRegPromise;
                try { swRegPromise = navigator.serviceWorker.getRegistration(); }
                catch { swRegPromise = Promise.reject(new Error('Service worker registration failed.')); }

                Promise.race([
                  swRegPromise.then((registration) => {
                    if (registration != null) return Promise.reject(new Error('Service worker already exists.'));
                    return registration;
                  }).then(() => engine.installServiceWorker()),
                  new Promise((resolve) => setTimeout(resolve, 2000)),
                ]).then(() => window.location.reload())
                 .catch((err) => console.error('Error while registering service worker:', err));
              } else {
                const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
                displayFailureNotice(missingMsg + missing.join('\n'));
              }
            } else {
              setStatusMode('progress');
              engine.startGame({
                onProgress(current, total) {
                  if (current > 0 && total > 0) {
                    statusProgress.value = current;
                    statusProgress.max = total;
                  } else {
                    statusProgress.removeAttribute('value');
                    statusProgress.removeAttribute('max');
                  }
                },
              }).then(() => {
                setStatusMode('hidden');
              }, displayFailureNotice);
            }
          }());
        }).catch(err => {
          console.error('Failed to merge or start:', err);
        });
        </script>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
	</body>
</html>
